apiVersion: batch/v1
kind: Job
metadata:
  name: load-graphql
spec:
  ttlSecondsAfterFinished: 200
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: pokeapi-last-built-resource-connection-checker
          image: curlimages/curl:latest
          command: ['sh', '-c']
          args:
            - until curl -f -s --output /dev/null http://pokeapi:80/api/v2/pal-park-area/5/;
              do echo waiting for pokeapi;
              sleep 2;
              done;
      containers:
        - name: load-graphql
          image: buildpack-deps:stable-scm
          env:
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: graphql-env-secret
                  key: HASURA_GRAPHQL_ADMIN_SECRET
            - name: POKEAPI_CHECKOUT_REF
              valueFrom:
                configMapKeyRef:
                  name: pokeapi-configmap
                  key: POKEAPI_CHECKOUT_REF
          command: ["sh", "-c"]
          args:
            - |
              set -e
              curl -L https://github.com/hasura/graphql-engine/releases/download/v2.48.1/cli-hasura-linux-amd64 -o /usr/local/bin/hasura
              chmod +x /usr/local/bin/hasura
              cd /tmp
              git clone https://github.com/PokeAPI/pokeapi.git
              cd pokeapi
              git checkout ${POKEAPI_CHECKOUT_REF} || git checkout master
              hasura md apply --endpoint http://graphql:8080 --project graphql/v1beta2 --admin-secret ${HASURA_GRAPHQL_ADMIN_SECRET}
