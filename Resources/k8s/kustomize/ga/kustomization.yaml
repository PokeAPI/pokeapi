apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../local

patches:
  - path: pokeapi-deployment-patch.yaml
    target:
      kind: Deployment
      labelSelector: component=pokeapi
  - path: load-graphql-patch.yaml
    target:
      kind: Job
      name: load-graphql
