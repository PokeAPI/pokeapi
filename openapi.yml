components:
  schemas:
    AbilityChange:
      type: object
      properties:
        version_group:
          allOf:
          - $ref: '#/components/schemas/VersionGroupSummary'
          description: The version group in which the previous effect of this ability
            originated.
        effect_entries:
          type: array
          items:
            $ref: '#/components/schemas/AbilityChangeEffectText'
          readOnly: true
          description: The previous effect of this ability listed in different languages.
      required:
      - effect_entries
      - version_group
    AbilityChangeEffectText:
      type: object
      properties:
        effect:
          type: string
          description: The localized effect text for an API resource in a specific
            language.
          maxLength: 6000
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this effect is in.
      required:
      - effect
      - language
    AbilityDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: The identifier for this resource.
        name:
          type: string
          description: The name for this resource.
          maxLength: 200
        is_main_series:
          type: boolean
          description: Whether or not this ability originated in the main series of
            the video games.
        generation:
          allOf:
          - $ref: '#/components/schemas/GenerationSummary'
          description: The generation this ability originated in.
        names:
          type: array
          items:
            $ref: '#/components/schemas/AbilityName'
          readOnly: true
          description: The name of this resource listed in different languages.
        effect_entries:
          type: array
          items:
            $ref: '#/components/schemas/AbilityEffectText'
          readOnly: true
          description: The effect of this ability listed in different languages.
        effect_changes:
          type: array
          items:
            $ref: '#/components/schemas/AbilityChange'
          readOnly: true
          description: The list of previous effects this ability has had across version
            groups.
        flavor_text_entries:
          type: array
          items:
            $ref: '#/components/schemas/AbilityFlavorText'
          readOnly: true
          description: The flavor text of this ability listed in different languages.
        pokemon:
          type: array
          items:
            $ref: '#/components/schemas/AbilityPokemonDetail'
          readOnly: true
          description: A list of Pokémon that could potentially have this ability.
      required:
      - effect_changes
      - effect_entries
      - flavor_text_entries
      - generation
      - id
      - name
      - names
      - pokemon
    AbilityEffectText:
      type: object
      properties:
        effect:
          type: string
          description: The localized effect text for an API resource in a specific
            language.
          maxLength: 6000
        short_effect:
          type: string
          description: The localized effect text in brief.
          maxLength: 300
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this effect is in.
      required:
      - effect
      - language
      - short_effect
    AbilityFlavorText:
      type: object
      properties:
        flavor_text:
          type: string
          description: The localized name for an API resource in a specific language.
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this text resource is in.
        version_group:
          allOf:
          - $ref: '#/components/schemas/VersionGroupSummary'
          description: The version group that uses this flavor text.
      required:
      - flavor_text
      - language
      - version_group
    AbilityName:
      type: object
      properties:
        name:
          type: string
          description: The localized name for an API resource in a specific language.
          maxLength: 200
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageSummary'
          description: The language this name is in.
      required:
      - language
      - name
    AbilityPokemonDetail:
      type: object
      properties:
        is_hidden:
          type: boolean
          description: Whether or not this a hidden ability for the referenced Pokémon.
        slot:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Pokémon have 3 ability 'slots' which hold references to possible
            abilities they could have. This is the slot of this ability for the referenced
            pokemon.
        pokemon:
          allOf:
          - $ref: '#/components/schemas/PokemonSummary'
          description: The Pokémon this ability could belong to.
      required:
      - pokemon
      - slot
    AbilitySummary:
      type: object
      properties:
        name:
          type: string
          description: The name of the referenced resource.
          maxLength: 200
        url:
          type: string
          format: uri
          readOnly: true
          description: The URL of the referenced resource.
      required:
      - name
      - url
    BerryDetail:
