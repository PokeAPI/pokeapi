openapi: 3.1.0
info:
  title: PokéAPI
  version: 2.10.0
  description: |-
    All the Pokémon data you'll ever need in one place, easily accessible through a modern free open-source RESTful API.

    ## What is this?

    This is a full RESTful API linked to an extensive database detailing everything about the Pokémon main game series.

    We've covered everything from Pokémon to Berry Flavors.

    ## Where do I start?

    We have awesome [documentation](https://pokeapi.co/docs/v2) on how to use this API. It takes minutes to get started.

    This API will always be publicly available and will never require any extensive setup process to consume.

    Created by [**Paul Hallett**](https://github.com/phalt) and other [**PokéAPI contributors**](https://github.com/PokeAPI/pokeapi#contributing) around the world. Pokémon and Pokémon character names are trademarks of Nintendo.
paths:
  /api/v2/meta/:
    get:
      operationId: meta_retrieve
      description: Returns metadata about the current deployed version of the API,
        including the git commit hash, deploy date, and tag (if any).
      summary: Get API metadata
      tags:
      - utility
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokeapiMetaResponse'
          description: ''
  /api/v2/ability/:
    get:
      operationId: ability_list
      description: Abilities provide passive effects for Pokémon in battle or in the
        overworld. Pokémon have multiple possible abilities but can have only one
        ability at a time. Check out [Bulbapedia](http://bulbapedia.bulbagarden.net/wiki/Ability)
        for greater detail.
      summary: List abilities
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: "> Only available locally and not at [pokeapi.co](https://pokeapi.co/docs/v2)\nCase-insensitive
          query applied on the `name` property. "
      tags:
      - pokemon
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAbilitySummaryList'
          description: ''
  /api/v2/ability/{id}/:
